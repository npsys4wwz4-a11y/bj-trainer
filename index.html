<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06281c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>מאמן בלאק ג'ק</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="bg" id="bg"></div>
<main class="wrap view" id="home">
 <svg class="crest" viewBox="0 0 100 100" aria-hidden="true">
  <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3c9"/><stop offset=".5" stop-color="#e8c873"/><stop offset="1" stop-color="#9c7629"/></linearGradient></defs>
  <circle cx="50" cy="50" r="46" fill="none" stroke="url(#g)" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="39" fill="none" stroke="url(#g)" stroke-width="1" stroke-dasharray="3 4"/>
  <path d="M50 22c9 12 22 19 22 31a11 11 0 0 1-19 7l3 14H44l3-14a11 11 0 0 1-19-7c0-12 13-19 22-31z" fill="url(#g)"/>
 </svg>
 <h1>מאמן<br>בלאק ג'ק</h1>
 <p class="sub">ספירת קלפים Hi-Lo · אסטרטגיה בסיסית · סטיות</p>
 <div class="rule"></div>
 <div class="chips" aria-hidden="true" id="chips"></div>
 <nav>
  <button class="btn primary" data-go="practice-count">
   <span class="ic"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="11" height="15" rx="2"/><path d="M9 4.5 10.5 4a2 2 0 0 1 2.4 1.3l4.6 13.2a2 2 0 0 1-1.3 2.5l-2.2.8"/><path d="M6.5 10h4M8.5 8v4"/></svg></span>
   <span><div class="t">תרגול עם ספירה</div><div class="d">אסטרטגיה, סטיות לפי ספירה ובוחן ספירה</div></span>
  </button>
  <button class="btn" data-go="practice-basic">
   <span class="ic"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="#e8c873" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="2.5"/><path d="M3.5 9.2h17M3.5 14.8h17M9.2 3.5v17M14.8 3.5v17"/></svg></span>
   <span><div class="t">אסטרטגיה בסיסית בלבד</div><div class="d">החלטות לפי הטבלה, בלי ספירה</div></span>
  </button>
  <button class="btn" data-go="settings">
   <span class="ic"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="#e8c873" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg></span>
   <span><div class="t">הגדרות</div><div class="d">חפיסות, DAS, תדירות בוחן, הצגת ספירה</div></span>
  </button>
  <button class="btn" data-go="drills">
   <span class="ic"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="#e8c873" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9.5 2.5h5M12 2.5V5"/></svg></span>
   <span><div class="t">תרגילים</div><div class="d">ספירת חפיסה נגד השעון, המרה לספירה אמיתית</div></span>
  </button>
  <button class="btn" data-go="stats">
   <span class="ic"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="#e8c873" stroke-width="1.7" stroke-linecap="round"><path d="M4 20h16M7 16v-5M12 16V6M17 16v-8"/></svg></span>
   <span><div class="t">סטטיסטיקה</div><div class="d">דיוק, בסיסי מול סטיות, טעויות נפוצות</div></span>
  </button>
  <button class="btn soon" disabled aria-disabled="true">
   <span class="ic"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="#e8c873" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5c3-1.5 6-1.5 9 0v13c-3-1.5-6-1.5-9 0z"/><path d="M21 6.5c-3-1.5-6-1.5-9 0v13c3-1.5 6-1.5 9 0z"/></svg></span>
   <span><div class="t">לימוד הטבלאות</div><div class="d">שינון אסטרטגיה וסטיות</div></span>
   <span class="badge">בקרוב</span>
  </button>
 </nav>
 <footer>טבלאות: Blackjack Apprenticeship · כלי לאימון בלבד</footer>
</main>
<section class="view" id="practice"></section>
<section class="view" id="settings"></section>
<section class="view" id="drills"></section>
<section class="view" id="stats"></section>
<div class="sheet" id="sheet"><div class="in" id="sheetIn"></div></div>
<script type="module" src="js/app.mjs"></script>
</body>
</html>
